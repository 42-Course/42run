# Branches and PRs only: pushes to main are already built and tested by
# release.yml.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make libs
      - run: make test
      - run: make
