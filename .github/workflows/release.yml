# Every push to main becomes a GitHub release: a self-contained source
# tarball (repo + lib subrepos), and per OS/arch the game (42run) and the
# engine's editor (pulga_editor + the pulga_run project to open), all built
# from that same tarball. Tag, codename and file prefix come from
# `make release-tag` / `make release-name` / `make release-pkg` /
# `make release-editor-pkg`.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      pkg: ${{ steps.meta.outputs.pkg }}
      editor_pkg: ${{ steps.meta.outputs.editor_pkg }}
    steps:
      - uses: actions/checkout@v4
      - run: make libs
      - run: make test
      - id: meta
        run: |
          echo "tag=$(make -s release-tag)" >> "$GITHUB_OUTPUT"
          echo "name=$(make -s release-name)" >> "$GITHUB_OUTPUT"
          echo "pkg=$(make -s release-pkg)" >> "$GITHUB_OUTPUT"
          echo "editor_pkg=$(make -s release-editor-pkg)" >> "$GITHUB_OUTPUT"
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 on purpose: its older glibc keeps the binary runnable on
          # older distros (and the 42 cluster).
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, label: linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x86_64 }
          # One lipo'd binary for both Intel and Apple Silicon Macs.
          - { os: macos-latest, target: universal-apple-darwin, label: macos-universal }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PKG: ${{ needs.source.outputs.pkg }}
      EDITOR_PKG: ${{ needs.source.outputs.editor_pkg }}
      BINS: 42run pulga_editor
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - name: Ensure a Rust toolchain
        run: command -v cargo || { curl -sSf https://sh.rustup.rs | sh -s -- -y; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
      - name: Build from the source tarball
        run: |
          tar -xzf dist/$PKG-src.tar.gz
          cd $PKG
          bin_args=$(printf -- '--bin %s ' $BINS)
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            for arch in x86_64 aarch64; do
              rustup target add $arch-apple-darwin
              cargo build --release $bin_args --target $arch-apple-darwin
            done
            for bin in $BINS; do
              lipo -create -output ../$bin \
                "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/$bin" \
                "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/$bin"
            done
          else
            rustup target add ${{ matrix.target }}
            cargo build --release $bin_args --target ${{ matrix.target }}
            exe=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
            for bin in $BINS; do
              cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/$bin$exe" ..
            done
          fi
      - name: Package
        run: |
          mkdir out game editor editor/pulga_run
          exe=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          cp 42run$exe game/
          # The engine ships with the pulga_run project, ready to open.
          cp pulga_editor$exe editor/
          cp $PKG/pulga_run/project.toml editor/pulga_run/
          for part in "game $PKG" "editor $EDITOR_PKG"; do
            set -- $part
            name=$2-${{ matrix.label }}
            if [ "$RUNNER_OS" = Windows ]; then
              (cd $1 && 7z a "../out/$name.zip" .)
            else
              tar -czf "out/$name.tar.gz" -C $1 .
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/

  publish:
    needs: [source, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.tag }}
          NAME: ${{ needs.source.outputs.name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$NAME ($TAG)" --notes-file dist/notes.md
